      organizationId
      visitCharge {
        id
        status
      }
    }
    adjustmentSnapshots {
      id
      invoiceId
      billingAdjustmentId
      type
      method
      value
      amount
      direction
      resolvedAmount
      reason
      organizationId
      billingAdjustment {
        id
        status
      }
    }
    payments {
      id
      visitId
      invoiceId
      organizationId
      amountPaid
      currency
      paymentMethod
      status
      paidAt
      confirmedAt
      receivedByStaffId
      reference
      notes
      allocations {
        id
        visitChargeId
        amountAllocated
        visitCharge {
          id
          chargeName
          totalAmount
          status
        }
      }
    }
    credits {
      id
      visitId
      visitChargeId
      amount
      method
      status
      reason
      notes
      processedByStaffId
      confirmedAt
      organizationId
      visitCharge {
        id
        chargeName
      }
    }
    balancePayments {
      id
      visitId
      amountPaid
      paymentMethod
      status
      paidAt
      confirmedAt
      receivedByStaffId
      reference
      reason
      notes
      organizationId
    }
  }
}

