query DashboardOverview($input: DashboardOverviewInput) {
  dashboardOverview(input: $input) {
    period
    periodStart
    generatedAt

    patients {
      activePatients
      registeredToday
      registeredInPeriod
      genderDistribution { label count }
      ageDistribution { label count }
      firstTimeVsReturning { label count }
    }

    visits {
      openVisits
      visitsInPeriod
      byStatus {
        label
        count
      }
      volumeTrend {
        label
        start
        count
      }
      recentOpenVisits {
        id
        patientId
        visitDateTime
        status
      }
      activityRevenue { label amount count }
    }

    laboratory {
      pending
      urgent
      inProgress
      completedInPeriod
      recentRequests {
        id
        visitId
        priority
        status
        createdAt
      }
    }

    beds {
      occupied
      totalActive
      allocatedInPeriod
      byWard { label count }
      byDepartment { label count }
    }

    theatre {
      todayProcedures
      upcoming
      delayed
      inProgress
      cancelled
      upcomingSchedule {
        id
        procedureId
        scheduledStartTime
        scheduledEndTime
        status
        priority
      }
      byStatus { label count }
      outcomes { label count }
    }

    financial {
      revenueToday
      revenueInPeriod
      overallOutstandingBalance
      outstandingBalanceInPeriod
      paymentsReceivedInPeriod
      pendingCredits
      successfulCreditsInPeriod
      creditsAmount
      refundsAmount
      revenueTrend {
        label
        start
        amount
      }
      recentTransactions {
        id
        type
        amount
        currency
        status
        recordedAt
      }
      paymentMethods { label count }
      revenueVsGrantsDiscounts { label amount count }
    }

    incidents {
      activeWardIncidents
      activeTheatreIncidents
      activeTotal
    }

    guests {
      pendingRequests
      byStatus { label count }
    }
  }
}